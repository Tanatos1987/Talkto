org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# R8 shrinks code and resources together (Play's "optimized resource shrinking"); the default since AGP 9, kept explicit.
android.r8.optimizedResourceShrinking=true
# AGP 9 turns on R8's strict full mode, where a library's "-keep class X" no longer keeps X's no-argument constructor.
# Libraries that make classes by name (ML Kit, and others whose rules were written for the old behaviour) then break
# only in release builds: 1.1.94 did not open. Off until every library's rules keep their constructors themselves.
android.r8.strictFullModeForKeepRules=false
