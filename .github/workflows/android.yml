name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.TALKTO_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests (JVM)
        run: ./gradlew :core:test --stacktrace

      - name: App unit tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: talkto-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The Play Store takes an Android App Bundle. Without the signing secrets it is built unsigned
      # (sign it before uploading); with them CI signs both the release APK and the bundle.
      - name: Build release bundle (AAB)
        if: env.HAS_KEYSTORE != 'true'
        run: ./gradlew :app:bundleRelease

      - name: Build signed release APK and bundle
        if: env.HAS_KEYSTORE == 'true'
        env:
          TALKTO_KEYSTORE_B64: ${{ secrets.TALKTO_KEYSTORE_B64 }}
          TALKTO_KEYSTORE_PASSWORD: ${{ secrets.TALKTO_KEYSTORE_PASSWORD }}
          TALKTO_KEY_ALIAS: ${{ secrets.TALKTO_KEY_ALIAS }}
          TALKTO_KEY_PASSWORD: ${{ secrets.TALKTO_KEY_PASSWORD }}
        run: |
          echo "$TALKTO_KEYSTORE_B64" | base64 -d > release.jks
          TALKTO_KEYSTORE=release.jks ./gradlew :app:assembleRelease :app:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: talkto-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: talkto-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
            app/build/outputs/mapping/release/missing_rules.txt
